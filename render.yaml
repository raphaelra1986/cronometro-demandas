# Render Blueprint - Deploy simplificado (1 serviço + banco)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cronometro-demandas
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build &&
      rm -rf ../backend/static && cp -r dist ../backend/static
    startCommand: |
      cd backend && gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: cronometro-db
          property: connectionString
    autoDeploy: true

databases:
  - name: cronometro-db
    plan: free
    region: oregon
